name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check optional DSH bridge
        run: node scripts/test_bridge.mjs
      - name: Prepare pinned original assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==11.3.0 numpy
          python scripts/prepare_assets.py
          python scripts/verify_assets.py
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: blue-fat-fish-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
